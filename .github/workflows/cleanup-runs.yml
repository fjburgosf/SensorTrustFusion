name: Limpieza de ejecuciones antiguas

# Mantenimiento manual: borra las ejecuciones de commits que ya no forman parte
# del historial de main y las ejecuciones de otras ramas.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Borrar ejecuciones de commits reemplazados y de otras ramas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-list origin/main > reachable.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.head_sha) \(.head_branch)"' |
          while read -r id sha branch; do
            if [ "$id" = "$GITHUB_RUN_ID" ]; then continue; fi
            if ! grep -q "^$sha$" reachable.txt || [ "$branch" != "main" ]; then
              echo "borrando ejecución $id ($branch, $sha)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            fi
          done
