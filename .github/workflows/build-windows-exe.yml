name: Ejecutable de Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar el Release v1.0.0 con el ejecutable de Windows"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows-exe:
    name: Compilar SensorTrustFusion.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .
      - name: Compilar el ejecutable
        working-directory: packaging
        run: pyinstaller SensorTrustFusion.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Prueba de arranque (abrir la ventana y salir)
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $env:SENSORTRUST_SMOKE_TEST = $marker
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\SensorTrustFusion.exe" -PassThru
          $p.WaitForExit(180000) | Out-Null
          if (-not (Test-Path $marker)) { throw "El ejecutable no arrancó correctamente." }
          Get-Content $marker
      - name: La ventana permanece abierta (no se cierra sola)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\SensorTrustFusion.exe" -PassThru
          Start-Sleep -Seconds 90
          if ($p.HasExited) { throw "El ejecutable se cerró solo (código de salida $($p.ExitCode))." }
          Write-Output "Sigue abierto después de 90 s (PID $($p.Id)); se cierra."
          Stop-Process -Id $p.Id -Force
      - name: Benchmark por línea de comandos con el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SensorTrustFusion.exe" -ArgumentList "benchmark","ST-BENCH-01","--no-figures","--results","exe_results" -PassThru -Wait
          if (-not (Get-ChildItem exe_results -Directory)) { throw "El ejecutable no produjo resultados." }
          Get-ChildItem exe_results -Recurse -Include manifest.json | Select-Object -First 1 | Get-Content
      - name: Monte Carlo en paralelo con el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SensorTrustFusion.exe" -ArgumentList "montecarlo","configs/montecarlo_abrupt_bias.yaml","--runs","8","--jobs","2","--results","exe_mc" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "El Monte Carlo falló (código de salida $($p.ExitCode))." }
          $f = Get-ChildItem exe_mc -Recurse -Include summary.csv,*.csv | Select-Object -First 1
          if (-not $f) { throw "El Monte Carlo no produjo tablas." }
          Write-Output "Resultados del Monte Carlo: $($f.FullName)"
      - name: Renombrar
        shell: pwsh
        run: Copy-Item dist\SensorTrustFusion.exe dist\SensorTrustFusion-1.0.0-win64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SensorTrustFusion-1.0.0-win64
          path: dist/SensorTrustFusion-1.0.0-win64.exe
          retention-days: 90

  release:
    name: Publicar el Release
    needs: windows-exe
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paquete de código fuente
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=SensorTrustFusion-1.0.0/ -o dist/SensorTrustFusion-1.0.0-source.zip HEAD
      - uses: actions/download-artifact@v4
        with:
          name: SensorTrustFusion-1.0.0-win64
          path: dist
      - name: Reemplazar el Release v1.0.0 anterior para que apunte a este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.0 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: SensorTrustFusion v1.0.0
          body: |
            SensorTrustFusion v1.0.0 - Plataforma científica para fusión multisensor adaptativa bajo degradación e incertidumbre de sensores.

            **Ejecutable de Windows:** `SensorTrustFusion-1.0.0-win64.exe` (un solo archivo; no requiere instalar Python ni hardware).
            Doble clic para abrir la interfaz gráfica. Línea de comandos: `SensorTrustFusion-1.0.0-win64.exe benchmark ST-BENCH-02`.

            **Código fuente:** `SensorTrustFusion-1.0.0-source.zip` (`src/`, `configs/`, `examples/`, `benchmarks/`, `packaging/`, `README.md`, `pyproject.toml`, `requirements.txt`). Los manuales están en la carpeta `Manuales/` del repositorio.
          files: |
            dist/SensorTrustFusion-1.0.0-win64.exe
            dist/SensorTrustFusion-1.0.0-source.zip
