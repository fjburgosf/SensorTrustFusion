experiment:
  name: ST-BENCH-16 - Dominant sensor progressive bias
  description: The most precise sensor S2 (0.05 m, dominating the fused estimate)
    develops a progressive bias of 0.02 m/s from t = 15 s. Includes the SensorTrust
    ablation without the consensus reference of the first moment.
  seed: 42
  tags:
  - benchmark
  - ST-BENCH-16
model:
  type: constant_velocity
  params:
    q: 0.05
  x0:
  - 0.0
  - 1.0
  P0:
  - 0.01
  - 0.01
  sample_initial_state: true
simulation:
  duration: 60.0
  fs: 100.0
sensors:
- name: S1
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.1
  nominal_reliability: 1.0
  degradations: []
- name: S2
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.05
  nominal_reliability: 1.0
  degradations:
  - type: progressive_bias
    severity: 0.02
    profile:
      type: step
      start: 15.0
- name: S3
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.2
  nominal_reliability: 1.0
  degradations: []
estimation:
  x0:
  - 0.0
  - 1.0
  P0:
  - 1.0
  - 1.0
methods:
- name: kf
- name: adaptive_kf
- name: kf_nis_gate
- name: sensortrust_kf
- name: sensortrust_kf
  label: SensorTrust KF (no consensus, ablation)
  trust:
    consensus: false
metrics:
  target_state: position
  warmup: 1.0
  rmse_max: 0.05
  trust_threshold: 0.5
output:
  figures:
  - png
  figure_dpi: 150
  save_dataset: true
