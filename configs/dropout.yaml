experiment:
  name: ST-BENCH-08 - Dropout
  description: S2 loses 60 % of its samples between 20 and 40 s; S3 suffers bursty
    packet loss (Gilbert-Elliott, P(good->bad) = 0.02, mean burst 50 samples) from
    30 s.
  seed: 42
  tags:
  - benchmark
  - ST-BENCH-08
model:
  type: constant_velocity
  params:
    q: 0.05
  x0:
  - 0.0
  - 1.0
  P0:
  - 0.01
  - 0.01
  sample_initial_state: true
simulation:
  duration: 60.0
  fs: 100.0
sensors:
- name: S1
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.1
  nominal_reliability: 1.0
  degradations: []
- name: S2
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.15
  nominal_reliability: 1.0
  degradations:
  - type: dropout
    severity: 0.6
    profile:
      type: step
      start: 20.0
      duration: 20.0
- name: S3
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.2
  nominal_reliability: 1.0
  degradations:
  - type: packet_loss
    severity: 0.02
    burst_length: 50
    profile:
      type: step
      start: 30.0
estimation:
  x0:
  - 0.0
  - 1.0
  P0:
  - 1.0
  - 1.0
methods:
- name: simple_average
- name: inverse_variance
- name: kf
- name: adaptive_kf
- name: kf_nis_gate
- name: sensortrust_kf
- name: kf_true_r
metrics:
  target_state: position
  warmup: 1.0
  rmse_max: 0.05
  trust_threshold: 0.5
output:
  figures:
  - png
  figure_dpi: 150
  save_dataset: true
