experiment:
  name: ST-BENCH-12 - Multiple degradation profiles
  description: 'Four sensors: S1 nominal; S2 sigmoid bias (1.0 m, 8 s transition)
    from 15 s; S3 periodic bias (0.8 m, period 8 s) from 25 s; S4 intermittent bias
    (1.2 m, mean on 1.5 s / off 3 s) from 35 s.'
  seed: 42
  tags:
  - benchmark
  - ST-BENCH-12
model:
  type: constant_velocity
  params:
    q: 0.05
  x0:
  - 0.0
  - 1.0
  P0:
  - 0.01
  - 0.01
  sample_initial_state: true
simulation:
  duration: 60.0
  fs: 100.0
sensors:
- name: S1
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.1
  nominal_reliability: 1.0
  degradations: []
- name: S2
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.15
  nominal_reliability: 1.0
  degradations:
  - type: bias
    severity: 1.0
    profile:
      type: sigmoid
      start: 15.0
      rise_time: 8.0
- name: S3
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.2
  nominal_reliability: 1.0
  degradations:
  - type: periodic
    severity: 0.8
    period: 8.0
    profile:
      type: step
      start: 25.0
- name: S4
  measures: position
  rate: 100.0
  noise:
    type: gaussian
    std: 0.12
  nominal_reliability: 1.0
  degradations:
  - type: intermittent
    severity: 1.2
    mean_on: 1.5
    mean_off: 3.0
    profile:
      type: step
      start: 35.0
estimation:
  x0:
  - 0.0
  - 1.0
  P0:
  - 1.0
  - 1.0
methods:
- name: simple_average
- name: inverse_variance
- name: kf
- name: adaptive_kf
- name: kf_nis_gate
- name: sensortrust_kf
- name: kf_true_r
metrics:
  target_state: position
  warmup: 1.0
  rmse_max: 0.05
  trust_threshold: 0.5
output:
  figures:
  - png
  figure_dpi: 150
  save_dataset: true
